# Codex CLI Project Configuration
# See: https://developers.openai.com/codex/local-config/

# Sandbox mode
# "read-only" = can read files, but writes and network blocked
# "workspace-write" = can write to cwd and $TMPDIR
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
writable_roots = [
  "~/develop"
]
network_access = false


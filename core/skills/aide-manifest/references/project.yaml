# .aide/project.yaml — the project's identity card (spec 78).
# TEAM knowledge, committed to git. All keys optional: leave out what
# is unknown rather than guessing. Links over prose.
name: example-project
description: One line on what the project is
generated: 2026-08-15          # stamped by /aide-manifest; staleness signal
stack:
  frontend: TypeScript/Vite
  backend: none                # e.g. Kotlin/Spring, or none
  database: none               # e.g. PostgreSQL, or none
dependencies:                  # services/projects this depends on
  - goatcounter (statistics)
deployment:
  host: Cloudflare Pages
  command: pnpm run deploy
  url: https://example.com
  # Optional. Only for a host that builds EVERY branch and serves each
  # on an address of its own. A template with a literal {branch} in it;
  # the dashboard puts the pushed branch's name there and shows the
  # result beside the compare link. Leave it out if there is no such
  # address — there is no default to fall back on.
  preview: https://{branch}.example.pages.dev
logging:
  where: Cloudflare dashboard -> Pages -> logs
statistics:                    # live dashboards
  - https://stats.example.com
reports:                       # generated reports, uniform shape
  - title: Daily traffic (Claude artifact)
    url: https://claude.ai/code/artifact/example
docs:
  - README.md
# Where the project keeps its reusable parts and the rules for using
# them: files or folders, each a path from the project root.
# /aide-analyze reads every one before it plans, and plans a new part
# only when nothing named here or in the code does the job. A folder is
# read file by file, so name one only when all of it is worth reading.
reuse:
  - src/components/
  - docs/design-system.md
# Gitignored paths a headless run must symlink into its worktree, space
# separated — a worktree carries TRACKED files only, so a project whose
# test command lives behind one of these fails in every run for a reason
# that has nothing to do with its change. Here rather than in
# .aide/config because it is true of the project on ANY machine, and
# .aide/config is not committed.
#
# WRITTEN BY THE DASHBOARD, not by /aide-manifest. Leave a worktreeLinks
# key exactly as found: never propose one, never remove one.
worktreeLinks: node_modules
# The project's test command — the only one a run reads. Set from the
# dashboard's Settings; kept exactly as found, never proposed.
AIDE_TEST_CMD: pnpm test -- --run
# How strictly /aide-analyze checks a spec's acceptance criteria: off,
# warn or stop. Absent is warn. Set from the dashboard's Settings; kept
# exactly as found, never proposed.
criteriaChecks: warn

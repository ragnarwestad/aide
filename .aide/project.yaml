# .aide/project.yaml — the project's identity card.
# TEAM knowledge, committed to git. All keys optional: leave out what
# is unknown rather than guessing. Links over prose.
name: aide
description: Configuration and tooling for AI-assisted development — skills, rules, hooks and installers for Claude Code, Codex and Copilot, plus the dashboard that renders aide's own manifests and spec progress
generated: 2026-08-17
stack:
  frontend: dashboard/ only — static HTML generated by Bun + TypeScript (no framework); the specs page inlines one small script, dashboard/src/queue-client.ts, which refreshes the list and posts its forms without reloading — every control still works with it off
  backend: shell scripts (installers, CLI) + Python/pytest test suite; dashboard/ adds a Bun server (dashboard/src/serve.ts) run by launchd on the serving host
  database: none
# Subdirectories with their own test command. A change is tested by the
# command(s) covering the files it touches: a file matches a scope when it
# IS the scope's path or lies under it, and everything else falls to the
# project's own detected command. See the tools-and-scripts skill,
# "Project commands", for the full rule.
testScopes:
  - path: dashboard
    command: cd dashboard && make test
dependencies:
  - pandoc (aide-generate-pdf / aide-generate-html)
  - mise (keeps the Codex/Copilot CLIs updated, daily cron)
  - markdownlint-cli2 via npx (lint gate)
  - bun (dashboard/ — build, test and serve)
  - yaml (npm, dashboard/ — manifest parsing)
deployment:
  host: local machines — installed globally to ~/.claude, ~/.codex, ~/.copilot, ~/.agents/skills and ~/.local/bin. The dashboard is served from a host of the operator's choice — no host is named in the repo; MINI=<host> selects one, or make serve-local runs everything on one machine
  command: ./install-all.sh (or per-tool implementations/<ai>/install.sh). Dashboard — MINI=<host> make -C dashboard install-serve (one-time); AIDE_DASH_HOST=<host> make -C dashboard publish (generate + rsync); make -C dashboard serve-local (single machine)
  url: dashboard — https://<serving-host>.<tailnet>.ts.net/ (tailscale serve terminates TLS in front of the server, which binds 127.0.0.1:8788; PORT= and TS_PORT= to change either)
logging:
  where: dashboard — ~/Library/Logs/aide-dashboard/serve.log on the serving host (launchd job com.aide-dashboard.serve)
# Gitignored paths a headless run must symlink into its worktree — a
# worktree carries TRACKED files only, and both of this repo's test
# commands live behind one of these: pytest is in .venv, and the
# dashboard's suite needs dashboard/node_modules. Here rather than in
# .aide/config (spec 184) because it is true of this repo on any
# machine, and .aide/config does not travel with a clone.
#
# Written by the dashboard. /aide-manifest leaves it exactly as found.
worktreeLinks: .venv dashboard/node_modules
docs:
  - README.md
  - docs/ROADMAP.md
  - docs/INSTALLATION.md
  - docs/AI_SUPPORT_MATRIX.md
  - docs/SKILL_GUIDE.md
  - dashboard/README.md
  - dashboard/docs/running-specs.md
  - dashboard/docs/the-specs-list.md
  - dashboard/docs/landing.md
  - dashboard/docs/projects.md
  - dashboard/docs/job-states.md
  - dashboard/docs/design-system.md
  - dashboard/docs/deploying.md
  - .claude/rules/development.md
  - .claude/rules/ai-tools-reference.md

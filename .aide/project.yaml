# .aide/project.yaml — the project's identity card.
# TEAM knowledge, committed to git. All keys optional: leave out what
# is unknown rather than guessing. Links over prose.
name: aide-dashboard
description: Read-only web dashboard for aide projects — renders the .aide/project.yaml manifests and spec progress as static HTML
generated: 2026-08-16
stack:
  frontend: static HTML generated by Bun + TypeScript (no framework, no JS on the page)
  backend: none — python3 http.server via launchd on the mac mini
  database: none
dependencies:
  - yaml (npm) — manifest parsing
  - Tailscale (publish transport and serving reachability)
deployment:
  host: rw-macmini-m2 — launchd job com.ragnarwestad.aide-dashboard-serve, port 8788
  command: make publish (generate + rsync); make install-serve (one-time)
  url: http://rw-macmini-m2:8788/
logging:
  where: rw-macmini-m2:~/Library/Logs/aide-dashboard/serve.log
docs:
  - README.md

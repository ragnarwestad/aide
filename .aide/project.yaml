# .aide/project.yaml — the settings a run and the board read.
# TEAM settings, committed to git. All keys optional: leave out what
# is unknown rather than guessing.
name: aide
description: Configuration and tooling for AI-assisted development — skills, rules, hooks and installers for Claude Code, Codex and Copilot, plus the dashboard that renders aide's own manifests and spec progress
# The project's test command: the whole suite, run by a step, the landing
# and /aide-implement. Read here and nowhere else.
AIDE_TEST_CMD: export PATH="$HOME/.local/share/mise/shims:$PATH"; scripts/test-python && cd dashboard && make test && make test-e2e
deployment:
  # A branch of this repository is tried by a board the dashboard starts
  # on its own machine (the Test server).
  previewFrom: command
# Gitignored paths a headless run must symlink into its worktree — a
# worktree carries TRACKED files only, and both of this repo's test
# commands live behind one of these: pytest is in .venv, and the
# dashboard's suite needs dashboard/node_modules. Here rather than in
# .aide/config because it is true of this repo on any machine, and
# .aide/config does not travel with a clone.
#
# Written by the dashboard.
worktreeLinks: .venv dashboard/node_modules

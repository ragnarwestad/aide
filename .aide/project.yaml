# .aide/project.yaml — the project's identity card.
# TEAM knowledge, committed to git. All keys optional: leave out what
# is unknown rather than guessing. Links over prose.
name: aide-dashboard
description: Read-only web dashboard for aide projects — renders the .aide/project.yaml manifests and spec progress as static HTML
generated: 2026-08-16
stack:
  frontend: static HTML generated by Bun + TypeScript (no framework, no JS on the page)
  backend: Bun server (src/serve.ts) via launchd on the serving host
  database: none
dependencies:
  - yaml (npm) — manifest parsing
deployment:
  host: operator's choice — no host is named in the repo; MINI=<host> selects one, or make serve-local runs everything on one machine
  command: MINI=<host> make install-serve (one-time); AIDE_DASH_HOST=<host> make publish (generate + rsync); make serve-local (single machine)
  url: http://<serving-host>:8788/ (PORT= to change)
logging:
  where: ~/Library/Logs/aide-dashboard/serve.log on the serving host (launchd job com.aide-dashboard.serve)
docs:
  - README.md

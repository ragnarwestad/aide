[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (require full workspace)
    validation: Validation tests (check output quality)
    e2e: End-to-end tests using CLI headless mode (slow, costs money)
    evaluation: Evaluation tests that call AI APIs to validate prompts (slow, costs money)
    slow: Tests that take a long time to run (API calls, complex workflows)
    claude_code: Claude Code implementation tests
    codex: Codex implementation tests
    copilot: Copilot implementation tests
    implementations: Cross-implementation parity tests
addopts =
    -v
    --strict-markers
    -m "not e2e and not evaluation"

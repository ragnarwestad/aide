# /aide-analyze - Analyze the codebase for JIRA/TODO
# Usage: /aide-analyze PROJ-1234
# Or: /aide-analyze todo-01

description = "Analyze the codebase and update 2-analysis.md and 3-solution.md"

prompt = """
Analyze the codebase for: {{args}}

STEP 0: FIND THE DOCUMENTATION
- If a JIRA issue (e.g. PROJ-*): Read reports/<NN>-<ISSUE_ID>-slug/1-description.md
- If todo-*: Read todo/<TODO_ID>/1-description.md
- If the file does not exist: Run /aide-create first

STEP 1: DETECT COMPLEXITY
Read core/rules/workflows.md for complexity detection:
- LOW: 1-2 files, simple changes
- MEDIUM: 3-10 files, moderate complexity
- HIGH: 10+ files, large refactorings

STEP 2: ANALYZE THE CODEBASE
- Search for relevant files based on the description
- Identify affected components with file:line references

STEP 3: ASSESS API IMPACT
- Is this frontend-only, backend-only, or both?
- Document affected endpoints

STEP 4: UPDATE THE DOCUMENTS
Update 2-analysis.md with:
- Affected files (file:line format)
- Complexity assessment
- Risk analysis
- API impact

Update 3-solution.md with:
- TDD-based implementation plan
- Step 0: Write tests (RED)
- Steps 1-N: Implementation (GREEN)
- Testing strategy (REFACTOR)

STEP 5: STAGE FILES
- git add <changed files>

STEP 6: CONFIRM
- Show a summary of the findings
- Next step: Run /aide-implement <ID>

IMPORTANT:
- Follow core/rules/workflows.md
- ALWAYS use file:line references
"""

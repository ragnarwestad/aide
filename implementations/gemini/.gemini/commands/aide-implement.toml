# /aide-implement - Implement with TDD
# Usage: /aide-implement PROJ-1234
# Or: /aide-implement todo-01

description = "Implement the solution with TDD (RED-GREEN-REFACTOR)"

prompt = """
Implement the solution for: {{args}}

STEP 0: READ THE DOCUMENTATION
- If a JIRA issue (e.g. PROJ-*): Read reports/<NN>-<ISSUE_ID>-slug/3-solution.md
- If todo-*: Read todo/<TODO_ID>/3-solution.md
- If the file is empty: Run /aide-analyze first

PHASE 1: RED (Write failing tests)

1. Read the implementation plan in 3-solution.md
2. Create test files as described in "Step 0: Write tests"
3. Run the tests: pnpm test -- --run <testfile>
4. VERIFY that the tests FAIL (this is expected!)
5. **STOP and ask for confirmation before continuing**

PHASE 2: GREEN (Implement until tests pass)

1. Implement the code step by step from 3-solution.md
2. After EACH step:
   - Run: pnpm test -- --run <testfile>
   - Verify that the tests pass
3. Follow the project's coding standards
4. **STOP and ask for confirmation before refactoring**

PHASE 3: REFACTOR (Verify and improve)

1. Run ALL tests: pnpm test -- --run
2. Run TypeScript: npx tsc --noEmit
3. Run linting: pnpm run eslint
4. Run build: pnpm run build
5. Fix any errors

STEP 4: UPDATE STATUS
- Update 4-status.md with progress
- Mark completed tasks with ✅

STEP 5: STAGE CHANGES
- git add <new and changed files>
- Do NOT use git add . or git add -A

IMPORTANT:
- Follow core/rules/testing.md
- Follow core/rules/git.md
- ALWAYS use the --run flag (NOT watch mode)
- Ask for confirmation between the phases
"""

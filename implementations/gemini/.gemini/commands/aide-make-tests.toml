# /aide-make-tests - Create missing unit tests
# Usage: /aide-make-tests src/utils/country.ts

description = "Analyze a file and create missing unit tests"

prompt = """
Analyze the file and create missing unit tests for: {{args}}

STEP 1: ANALYZE THE FILE
- Read the file: {{args}}
- Identify all exported functions
- Check the existing test file (e.g. <file>.test.ts)
- Identify gaps in the test coverage

STEP 2: WRITE COMPREHENSIVE TESTS
For each function that lacks tests:
- Happy path (normal scenarios)
- Edge cases (boundary conditions)
- Error cases (error handling)

STEP 3: RUN TESTS AND VERIFY
- Run: pnpm test -- --run <testfile>
- Verify that all new tests pass
- Fix any errors

STEP 4: GENERATE A COVERAGE REPORT
- Run: pnpm test -- --coverage <file-path>
- Show before/after test coverage
- Summarize the number of tests created

IMPORTANT RULES:
- Follow the project's coding standard for test style
- Follow core/rules/testing.md for TDD principles
- Use Vitest for unit tests
- Use React Testing Library for React components
- Mock external dependencies (API calls, etc.)
- ALWAYS use the --run flag (NOT watch mode)

STOP AND ASK FOR CONFIRMATION:
- After the tests are written (before running)
- After the tests are run (before commit)

EXPECTED OUTPUT:
```
✅ Test analysis completed for <file>

Functions analyzed: N
- function1() - HAS tests ✅
- function2() - MISSING tests ❌

New tests created: N
- function2() - X tests (happy path + edge cases + errors)

Test result:
  ✅ N/N tests pass

Coverage:
  Before: XX%
  After:  XX%
  Increase: +XX%

📖 Next step: Stage and commit the changes
```
"""

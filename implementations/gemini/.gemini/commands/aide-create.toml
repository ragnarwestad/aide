# /aide-create - Create JIRA/TODO documentation
# Usage: /aide-create PROJ-7890
# Or: /aide-create todo-name Description of the task

description = "Create structured documentation for a JIRA issue or TODO plan"

prompt = """
Create documentation for: {{args}}

STEP 0: DETECT TYPE
- If the argument starts with "PROJ-": This is a JIRA issue
- If the argument starts with "TODO": This is a TODO plan
- Otherwise: Ask the user whether it is JIRA or TODO

FOR A JIRA ISSUE (PROJ-XXXX):
1. Check that AIDE_INSTALLATION_PATH is set (stop with an error message if not).
2. Assign the next available number, and create the directory reports/<NN>-PROJ-XXXX-slug/
   with the files from the templates in core/templates/todo/: 0-README.md, 1-description.md,
   2-analysis.md, 3-solution.md, 4-status.md. Fill in the JIRA metadata in
   1-description.md (the user pastes in the JIRA data).
3. Verify that the files were created.
4. Show a summary. Next step: /aide-analyze <NN>

FOR A TODO PLAN:
1. Check that AIDE_INSTALLATION_PATH is set.
2. Assign the next available number, generate a slug from the title, and create
   reports/<NN>-slug/ with the same files from the templates in core/templates/todo/.
3. Verify that the files were created.
4. Show a summary. Next step: /aide-analyze <NN>

IMPORTANT:
- Follow core/rules/workflows.md
- Follow core/rules/documentation.md
"""

# /aide-react-class-to-func - Convert React class to functional
# Usage: /aide-react-class-to-func src/components/UserProfile.tsx

description = "Convert a React class component to a functional component with hooks"

prompt = """
Convert the React class component to a functional component with hooks for: {{args}}

STEP 1: ANALYZE THE CLASS COMPONENT
- Read the file: {{args}}
- Identify:
  - Lifecycle methods (componentDidMount, componentDidUpdate, componentWillUnmount)
  - State (this.state)
  - Props (this.props)
  - Refs (this.refs or React.createRef())
  - Context (this.context)
  - PureComponent vs Component

STEP 2: PLAN THE CONVERSION
Create a mapping table:
- componentDidMount → useEffect(() => {}, [])
- componentDidUpdate → useEffect(() => {}, [deps])
- componentWillUnmount → useEffect cleanup function
- this.state → useState()
- this.props → function parameters
- this.refs → useRef()
- Context → useContext()
- PureComponent → React.memo()

STEP 3: CONVERT TO A FUNCTIONAL COMPONENT
- Write the new functional component
- Convert lifecycle to hooks
- Convert state to useState
- Convert refs to useRef
- Wrap with React.memo() if PureComponent

STEP 4: VERIFY WITH TESTS
- Find the existing test file (e.g. <file>.test.tsx)
- Run: pnpm test -- --run <testfile>
- Verify that ALL tests still pass
- If tests fail: analyze and fix

STEP 5: UPDATE THE IMPORTS
- Change the class export to a const export
- Remove Component/PureComponent from imports
- Add hooks (useState, useEffect, etc.)

IMPORTANT RULES:
- Follow the project's coding standard for React style
- NEVER change business logic - only convert patterns
- Keep exactly the same props interface
- Keep exactly the same behavior
- Verify with tests that the behavior is identical
- ALWAYS use the --run flag (NOT watch mode)

STOP AND ASK FOR CONFIRMATION:
- After the conversion plan is created (before code changes)
- After the code is converted (before testing)
- After the tests are run (before commit)

CONVERSION PATTERNS:

Lifecycle → useEffect:
```typescript
// Before (class)
componentDidMount() {
  this.fetchData();
}

// After (functional)
useEffect(() => {
  fetchData();
}, []);
```

State → useState:
```typescript
// Before (class)
state = { user: null, loading: false };
this.setState({ loading: true });

// After (functional)
const [user, setUser] = useState(null);
const [loading, setLoading] = useState(false);
setLoading(true);
```

PureComponent → React.memo:
```typescript
// Before (class)
class UserProfile extends React.PureComponent { ... }

// After (functional)
const UserProfile = React.memo(({ userId }) => { ... });
```

EXPECTED OUTPUT:
```
✅ Conversion completed for <file>

Conversion mapping:
  componentDidMount → useEffect(() => { ... }, [])
  this.state (x, y, z) → useState() x3
  this.refs → useRef()

Changes:
  Before: XX lines (class-based)
  After: XX lines (functional with hooks)

Test result:
  ✅ N/N tests pass
  No behavior change detected

📖 Next step: Stage and commit the changes
```
"""

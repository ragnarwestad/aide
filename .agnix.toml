# agnix (the IDE's agent-config linter) for this repository.

# Two files that belong to different projects by design: .claude/CLAUDE.md
# steers work on this repo (bun in dashboard/), and core/AGENTS.md is built
# for the projects Aide is installed into (pnpm in its examples).
[[overrides]]
paths = [".claude/CLAUDE.md", "core/AGENTS.md"]
disabled_rules = ["XP-004"]

# Only Claude Code reads .claude/, so naming Claude Code's own paths there
# is the point, not a portability risk.
[[overrides]]
paths = [".claude/**"]
disabled_rules = ["XP-003"]

# core/AGENTS.md is BUILT from core/rules/*.md (build-agents-md.sh) for the
# projects Aide installs into — Codex and Copilot read it there. The rules
# it carries are written for people as much as for a model, and these five
# checks argue with that wording rather than with a fault:
#
#   AGM-003     a 12 000-character ceiling for Windsurf, which Aide does not target
#   PE-001      where a keyword sits in the document
#   PE-004      words like "often"
#   PE-006      a rule phrased as a prohibition
#   CDX-AG-005  paths inside prose, resolved against core/ instead of the repo root
[[overrides]]
paths = ["core/AGENTS.md"]
disabled_rules = ["AGM-003", "PE-001", "PE-004", "PE-006", "CDX-AG-005"]

# `effort` and `argument-hint` are Claude Code's own skill fields. Every
# skill in core/skills carries them on purpose: Claude Code uses them, and
# the other tools ignore a field they do not know (docs/AI_SUPPORT_MATRIX.md).
[[overrides]]
paths = ["core/skills/**"]
disabled_rules = ["XP-SK-001"]
